<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D План — Колледж МГКЦТ (Минск, ул. Казинца, 91)</title>
    <!-- Tailwind CSS & Google Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- Стили -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="canvas-container"></div>

    <!-- Верхняя левая шапка -->
    <div class="ui-overlay fixed top-4 left-4 z-20 glass-panel rounded-xl px-4 py-3 flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-slate-800/90 border border-slate-700/80 flex items-center justify-center text-slate-300 shadow-sm flex-shrink-0">
            <svg class="w-4 h-4 text-slate-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
            </svg>
        </div>
        <div>
            <div class="flex items-center gap-2">
                <h1 class="text-xs font-bold tracking-wider text-slate-100 uppercase">Колледж МГКЦТ</h1>
                <span class="text-[10px] text-slate-400 bg-slate-800/80 border border-slate-700/60 px-1.5 py-0.5 rounded font-medium">Минск, ул. Казинца, 91</span>
            </div>
            <p id="status-subtitle" class="text-[11px] text-slate-400 mt-0.5">Корпуса 1, 2, 3 и 4 • Интерактивный 3D план</p>
        </div>
    </div>

    <!-- Правая панель контроллеров -->
    <div class="ui-overlay fixed top-4 right-4 z-20 glass-panel custom-scroll rounded-xl p-4 w-80 max-h-[94vh] overflow-y-auto flex flex-col gap-3 text-xs">
        
        <!-- Выбор корпуса -->
        <div>
            <div class="text-slate-400 font-semibold uppercase tracking-wider mb-1.5 text-[11px]">
                Корпус
            </div>
            <div class="grid grid-cols-5 gap-1.5">
                <button id="btn-bldg-both" class="bldg-btn btn-interactive active bg-slate-800/80 hover:bg-slate-700 text-slate-200 font-medium py-1.5 px-1 rounded-lg border border-slate-700/80 text-center">
                    Все
                </button>
                <button id="btn-bldg-1" class="bldg-btn btn-interactive bg-slate-800/80 hover:bg-slate-700 text-slate-200 font-medium py-1.5 px-1 rounded-lg border border-slate-700/80 text-center">
                    К-1
                </button>
                <button id="btn-bldg-2" class="bldg-btn btn-interactive bg-slate-800/80 hover:bg-slate-700 text-slate-200 font-medium py-1.5 px-1 rounded-lg border border-slate-700/80 text-center">
                    К-2
                </button>
                <button id="btn-bldg-3" class="bldg-btn btn-interactive bg-slate-800/80 hover:bg-slate-700 text-slate-200 font-medium py-1.5 px-1 rounded-lg border border-slate-700/80 text-center">
                    К-3
                </button>
                <button id="btn-bldg-4" class="bldg-btn btn-interactive bg-slate-800/80 hover:bg-slate-700 text-slate-200 font-medium py-1.5 px-1 rounded-lg border border-slate-700/80 text-center">
                    К-4
                </button>
            </div>
        </div>

        <hr class="panel-divider">

        <!-- Режим этажей -->
        <div>
            <div class="text-slate-400 font-semibold uppercase tracking-wider mb-1.5 text-[11px]">
                Этажи
            </div>
            <div class="grid grid-cols-2 gap-1.5 mb-1.5">
                <button id="btn-mode-all" class="mode-btn btn-interactive active bg-slate-800/80 hover:bg-slate-700 text-slate-200 font-medium py-1.5 px-2 rounded-lg border border-slate-700/80 text-center">
                    Все этажи (Стопка)
                </button>
                <button id="btn-mode-side" class="mode-btn btn-interactive bg-slate-800/80 hover:bg-slate-700 text-slate-200 font-medium py-1.5 px-2 rounded-lg border border-slate-700/80 text-center">
                    Сравнение рядом
                </button>
            </div>
            <div class="grid grid-cols-7 gap-1">
                <button id="btn-mode-7" class="mode-btn btn-interactive bg-slate-800/80 hover:bg-slate-700 text-slate-200 font-medium py-1.5 px-1 rounded-lg border border-slate-700/80 text-center">7</button>
                <button id="btn-mode-6" class="mode-btn btn-interactive bg-slate-800/80 hover:bg-slate-700 text-slate-200 font-medium py-1.5 px-1 rounded-lg border border-slate-700/80 text-center">6</button>
                <button id="btn-mode-5" class="mode-btn btn-interactive bg-slate-800/80 hover:bg-slate-700 text-slate-200 font-medium py-1.5 px-1 rounded-lg border border-slate-700/80 text-center">5</button>
                <button id="btn-mode-4" class="mode-btn btn-interactive bg-slate-800/80 hover:bg-slate-700 text-slate-200 font-medium py-1.5 px-1 rounded-lg border border-slate-700/80 text-center">4</button>
                <button id="btn-mode-3" class="mode-btn btn-interactive bg-slate-800/80 hover:bg-slate-700 text-slate-200 font-medium py-1.5 px-1 rounded-lg border border-slate-700/80 text-center">3</button>
                <button id="btn-mode-2" class="mode-btn btn-interactive bg-slate-800/80 hover:bg-slate-700 text-slate-200 font-medium py-1.5 px-1 rounded-lg border border-slate-700/80 text-center">2</button>
                <button id="btn-mode-1" class="mode-btn btn-interactive bg-slate-800/80 hover:bg-slate-700 text-slate-200 font-medium py-1.5 px-1 rounded-lg border border-slate-700/80 text-center">1</button>
            </div>

            <!-- Срез сверху вниз -->
            <div class="mt-2.5">
                <div class="flex justify-between items-center mb-1 text-[11px]">
                    <span class="text-slate-400 font-semibold uppercase tracking-wider">Срез сверху вниз</span>
                    <span id="slice-val" class="text-slate-300 font-mono text-[11px] bg-slate-800/80 border border-slate-700/60 px-1.5 py-0.5 rounded">1–7 эт.</span>
                </div>
                <input id="slider-slice" type="range" min="1" max="7" step="1" value="7" class="w-full cursor-pointer">
            </div>
        </div>

        <hr class="panel-divider">

        <!-- Разнос этажей по вертикали -->
        <div class="flex flex-col gap-2">
            <div class="flex justify-between items-center text-[11px]">
                <span class="text-slate-400 font-semibold uppercase tracking-wider">Разнос этажей</span>
                <span id="explode-val" class="text-slate-300 font-mono text-[11px] bg-slate-800/80 border border-slate-700/60 px-1.5 py-0.5 rounded">0.0 м</span>
            </div>
            <input id="slider-explode" type="range" min="0" max="14" step="0.2" value="0" class="w-full cursor-pointer">
            <button id="btn-explode" class="btn-interactive w-full py-1.5 px-3 rounded-lg font-medium text-slate-200 bg-slate-800/80 hover:bg-slate-700/80 border border-slate-700/80 transition flex items-center justify-center gap-1.5 shadow-sm text-xs mt-0.5">
                <span class="flex items-center justify-center gap-1.5">
                    <svg class="w-3.5 h-3.5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
                    </svg>
                    Разнести этажи
                </span>
            </button>
        </div>

        <hr class="panel-divider">

        <!-- Ракурс камеры -->
        <div>
            <div class="text-slate-400 font-semibold uppercase tracking-wider mb-1.5 text-[11px]">
                Ракурс камеры
            </div>
            <div class="grid grid-cols-2 gap-1.5">
                <button id="btn-view-3d" class="btn-interactive bg-slate-800/80 hover:bg-slate-700 text-slate-200 font-medium py-1.5 px-2 rounded-lg border border-slate-700/80 text-center">
                    3D Изометрия
                </button>
                <button id="btn-view-top" class="btn-interactive bg-slate-800/80 hover:bg-slate-700 text-slate-200 font-medium py-1.5 px-2 rounded-lg border border-slate-700/80 text-center">
                    Сверху (План)
                </button>
                <button id="btn-view-305" class="btn-interactive bg-slate-800/80 hover:bg-slate-700 text-slate-200 font-medium py-1.5 px-2 rounded-lg border border-slate-700/80 text-center">
                    Узел переходов
                </button>
                <button id="btn-view-side" class="btn-interactive bg-slate-800/80 hover:bg-slate-700 text-slate-200 font-medium py-1.5 px-2 rounded-lg border border-slate-700/80 text-center">
                    Фронтальный
                </button>
            </div>
        </div>

        <hr class="panel-divider">

        <!-- Ползунки параметров -->
        <div class="flex flex-col gap-2.5">
            <div>
                <div class="flex justify-between items-center mb-1 text-[11px]">
                    <span class="text-slate-300">Высота стен</span>
                    <span id="wall-height-val" class="text-slate-300 font-mono text-[11px] bg-slate-800/80 border border-slate-700/60 px-1.5 py-0.5 rounded">2.40 м</span>
                </div>
                <input id="slider-wall-height" type="range" min="1.0" max="4.5" step="0.1" value="2.4" class="w-full cursor-pointer">
            </div>

            <div>
                <div class="flex justify-between items-center mb-1 text-[11px]">
                    <span class="text-slate-300">Непрозрачность плит</span>
                    <span id="slab-opacity-val" class="text-slate-300 font-mono text-[11px] bg-slate-800/80 border border-slate-700/60 px-1.5 py-0.5 rounded">100%</span>
                </div>
                <input id="slider-slab-opacity" type="range" min="0.25" max="1.0" step="0.05" value="1.0" class="w-full cursor-pointer">
            </div>
        </div>

        <hr class="panel-divider">

        <!-- Переключатели элементов -->
        <div>
            <div class="text-slate-400 font-semibold uppercase tracking-wider mb-1.5 text-[11px]">
                Отображение
            </div>
            <div class="flex flex-col gap-1">
                <label class="flex items-center justify-between cursor-pointer py-1 px-1 rounded-md hover:bg-white/[0.04] transition-colors">
                    <span class="text-slate-300">Двери и проходы</span>
                    <input id="toggle-doors" type="checkbox" checked class="switch-input">
                    <div class="switch-track"><div class="switch-thumb"></div></div>
                </label>
                <label class="flex items-center justify-between cursor-pointer py-1 px-1 rounded-md hover:bg-white/[0.04] transition-colors">
                    <span class="text-slate-300">Номера кабинетов</span>
                    <input id="toggle-labels" type="checkbox" checked class="switch-input">
                    <div class="switch-track"><div class="switch-thumb"></div></div>
                </label>
                <label class="flex items-center justify-between cursor-pointer py-1 px-1 rounded-md hover:bg-white/[0.04] transition-colors">
                    <span class="text-slate-300">Скрытие закрытых плашек</span>
                    <input id="toggle-smart-occlusion" type="checkbox" checked class="switch-input">
                    <div class="switch-track"><div class="switch-thumb"></div></div>
                </label>
                <label class="flex items-center justify-between cursor-pointer py-1 px-1 rounded-md hover:bg-white/[0.04] transition-colors">
                    <span class="text-slate-300">Крыша</span>
                    <input id="toggle-roof" type="checkbox" class="switch-input">
                    <div class="switch-track"><div class="switch-thumb"></div></div>
                </label>
                <label class="flex items-center justify-between cursor-pointer py-1 px-1 rounded-md hover:bg-white/[0.04] transition-colors">
                    <span class="text-slate-300">Оси совпадения лестниц</span>
                    <input id="toggle-stair-axes" type="checkbox" class="switch-input">
                    <div class="switch-track"><div class="switch-thumb"></div></div>
                </label>
                <label class="flex items-center justify-between cursor-pointer py-1 px-1 rounded-md hover:bg-white/[0.04] transition-colors">
                    <span class="text-slate-300">Линии вертикали этажей</span>
                    <input id="toggle-guides" type="checkbox" checked class="switch-input">
                    <div class="switch-track"><div class="switch-thumb"></div></div>
                </label>
                <label class="flex items-center justify-between cursor-pointer py-1 px-1 rounded-md hover:bg-white/[0.04] transition-colors">
                    <span class="text-slate-300">Контуры чертежа (Edges)</span>
                    <input id="toggle-edges" type="checkbox" checked class="switch-input">
                    <div class="switch-track"><div class="switch-thumb"></div></div>
                </label>
            </div>
        </div>
    </div>

    <!-- Информационная подсказка по управлению внизу экрана -->
    <div class="ui-overlay fixed bottom-4 left-4 z-20 glass-panel rounded-lg px-4 py-2 text-xs text-slate-400 flex flex-wrap items-center gap-4">
        <span><strong class="text-slate-200 font-medium">ЛКМ:</strong> Вращение</span>
        <span><strong class="text-slate-200 font-medium">ПКМ / Shift+ЛКМ:</strong> Панорама</span>
        <span><strong class="text-slate-200 font-medium">Колёсико:</strong> Зум к курсору</span>
        <span><strong class="text-slate-200 font-medium">H:</strong> Скрыть интерфейс</span>
    </div>

    <!-- Подключение JS модулей -->
    <script src="js/state.js"></script>
    <script src="js/materials.js"></script>
    <script src="js/helpers.js"></script>
    <script src="js/buildings/building1.js"></script>
    <script src="js/buildings/building2.js"></script>
    <script src="js/buildings/building3.js"></script>
    <script src="js/buildings/building4.js"></script>
    <script src="js/controls.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
